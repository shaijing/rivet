[workspace]
members = [
    "crates/rivet-core",
    "crates/rivet-data",
    "crates/rivet-plan",
    "crates/rivet-exec",
    "crates/rivet-kernels",
    "crates/rivet-python",
    "crates/rivet-vision",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shaijing/rivet"

[workspace.dependencies]
arrow = "58.4.0"
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-ipc = "58.4.0"
bytes = "1.12.1"
cudarc = { version = "0.19.8", default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "f16",
    # cudarc 0.19.x does not recognize CUDA 13.4 yet; the 13.3 API profile is
    # compatible with the installed 13.x driver/toolkit for this runtime layer.
    "cuda-13030",
    "dynamic-linking",
] }
half = "2.7.1"
lance = {version = "11.0.0", default-features = false}
memmap2 = "0.9.11"
rivet-core = { path = "crates/rivet-core" }
rivet-data = { path = "crates/rivet-data", default-features = false }
rivet-plan = { path = "crates/rivet-plan" }
rivet-exec = { path = "crates/rivet-exec" }
rivet-kernels = { path = "crates/rivet-kernels" }
rivet-vision = { path = "crates/rivet-vision", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["full"] }
