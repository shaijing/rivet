[workspace]
members = [
    "crates/rivet-core",
    "crates/rivet-data",
    "crates/rivet-plan",
    "crates/rivet-exec",
    "crates/rivet-text",
    "crates/rivet-python",
    "crates/rivet-vision",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shaijing/rivet"

[workspace.dependencies]
# Keep Arrow aligned with Lance's Arrow types (Lance 14 uses Arrow 58).
arrow = "58.4.1"
arrow-array = "58.4.1"
arrow-buffer = "58.4.1"
arrow-ipc = "58.4.1"
bytes = "1.12.1"
criterion = "0.8.2"
half = "2.7.1"
lance = {version = "14.0.3", default-features = false}
memmap2 = "0.9.12"
rivet-core = { path = "crates/rivet-core" }
rivet-data = { path = "crates/rivet-data", default-features = false }
rivet-plan = { path = "crates/rivet-plan" }
rivet-exec = { path = "crates/rivet-exec" }
rivet-text = { path = "crates/rivet-text" }
rivet-vision = { path = "crates/rivet-vision", default-features = false }
thiserror = "2.0.21"
tokenizers = "1.0.0-rc.4"
tokio = { version = "1.54.1", features = ["full"] }
