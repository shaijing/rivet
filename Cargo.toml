[workspace]
members = [
    "crates/rivet-core",
    "crates/rivet-data",
    "crates/rivet-python",
    "crates/rivet-vision",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shaijing/rivet"

[workspace.dependencies]
arrow = "58.4.0"
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-ipc = "58.4.0"
bytes = "1.12.1"
half = "2.7.1"
lance = {version = "11.0.0", default-features = false}
memmap2 = "0.9.11"
rivet-core = { path = "crates/rivet-core" }
rivet-data = { path = "crates/rivet-data", default-features = false }
rivet-vision = { path = "crates/rivet-vision", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["full"] }
