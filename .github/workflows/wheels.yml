name: Build wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: CPython 3.13 / manylinux_2_28 x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      # Use Zig's linker instead of the repository's local mold override.
      RUSTFLAGS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config protobuf-compiler

      - name: Build wheel with Zig
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: x86_64-unknown-linux-gnu
          container: "off"
          command: build
          args: >-
            --release --locked --zig --manylinux 2_28
            --no-default-features --features lance
            --interpreter python3.13 --out dist

      - name: Check installed wheel
        run: |
          python -m pip install numpy
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import rivet; from rivet._rivet import _LanceDataset; assert rivet.vision.Pipeline is rivet.Pipeline'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-cp313-manylinux_2_28-x86_64
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
