name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: CPython 3.13 / manylinux_2_35 x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      PROTOC: /usr/bin/protoc
      PROTOC_INCLUDE: /usr/include

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.13"
          activate-environment: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake mold ninja-build pkg-config \
            protobuf-compiler libprotobuf-dev libopenblas-pthread-dev

      - name: Install wheel repair tools
        run: |
          # maturin-action also invokes python -m pip internally.
          uv pip install pip "patchelf==0.19.3" "auditwheel==6.8.2"
          python -m pip --version
          patchelf --version

      - name: Check Protobuf toolchain
        run: |
          "$PROTOC" --version
          test -f "$PROTOC_INCLUDE/google/protobuf/empty.proto"
          "$PROTOC" --proto_path="$PROTOC_INCLUDE" \
            --descriptor_set_out="$RUNNER_TEMP/protobuf-empty.pb" \
            google/protobuf/empty.proto

      - name: Build and repair wheel with Zig and maturin
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: x86_64-unknown-linux-gnu
          container: "off"
          command: build
          args: >-
            --release --locked --zig --manylinux 2_35 --auditwheel repair
            --no-default-features --features lance,blas
            --interpreter python3.13 --out dist

      - name: Inspect repaired wheel
        run: |
          auditwheel show dist/*.whl
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          assert "manylinux_2_35_x86_64" in wheel.name, wheel.name
          with ZipFile(wheel) as archive:
              libraries = [Path(name).name for name in archive.namelist() if ".so" in name]
              for dependency in ("libopenblas", "libgfortran", "libquadmath"):
                  assert any(name.startswith(dependency) for name in libraries), (dependency, libraries)
          PY

      - name: Check installed wheel
        run: |
          uv pip install numpy
          uv pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import rivet; from rivet._rivet import _LanceDataset; assert rivet.vision.Pipeline is rivet.Pipeline'
          python - <<'PY'
          from pathlib import Path
          import numpy
          import rivet._rivet

          # Importing the extension must resolve BLAS through the bundled libraries.
          mappings = Path("/proc/self/maps").read_text().splitlines()
          site_packages = Path(rivet._rivet.__file__).resolve().parent.parent
          for dependency in ("libopenblas", "libgfortran", "libquadmath"):
              loaded = {line.split()[-1] for line in mappings if dependency in line}
              assert loaded, dependency
              assert any(Path(path).is_relative_to(site_packages) for path in loaded), loaded
          PY

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-cp313-manylinux_2_35-x86_64
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create release and upload wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl --clobber
          else
            gh release create "$TAG" dist/*.whl \
              --verify-tag --title "$TAG" --generate-notes
          fi
