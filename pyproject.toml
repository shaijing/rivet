[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "rivet"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "datasets>=5.0.1",
    "httpx[socks]>=0.28.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pylance>=11.0.0",
]

[tool.maturin]
python-source = "src"
module-name = "rivet._rivet"
manifest-path = "crates/rivet-python/Cargo.toml"
features = ["lance"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
torch = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
