[package]
name = "rivet-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings exposing Rivet data and vision pipelines to Python"

[lib]
name = "_rivet"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["lance"]
lance = ["rivet-data/lance", "rivet-vision/lance"]
blas = ["rivet-vision/blas"]

[dependencies]
arrow-buffer.workspace = true
half.workspace = true
# rust-numpy 0.30 requires PyO3 0.30; upgrade this pair together.
numpy = { version = "0.30.0", features = ["half"] }
pyo3 = "0.30.1"
rivet-core.workspace = true
rivet-data.workspace = true
rivet-vision.workspace = true
