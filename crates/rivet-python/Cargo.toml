[package]
name = "rivet-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings exposing Rivet data and vision pipelines to Python"

[lib]
name = "_rivet"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
lance = ["rivet-vision/lance"]

[dependencies]
arrow-buffer.workspace = true
numpy.workspace = true
pyo3.workspace = true
rivet-core.workspace = true
rivet-data.workspace = true
rivet-vision.workspace = true
