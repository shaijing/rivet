[package]
name = "rivet-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings exposing Rivet data and vision pipelines to Python"

[lib]
name = "_rivet"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["lance"]
lance = ["rivet-vision/lance"]

[dependencies]
arrow-buffer.workspace = true
half.workspace = true
numpy = { version = "0.29.0", features = ["half"] }
pyo3 = "0.29.0"
rivet-core.workspace = true
rivet-data.workspace = true
rivet-vision.workspace = true
