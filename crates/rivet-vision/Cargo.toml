[package]
name = "rivet-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Image datasets, transforms, batching, caching, and data loading pipelines"

[features]
default = []
lance = ["rivet-data/lance", "dep:lance"]

[dependencies]
arrow.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
image.workspace = true
lance = { workspace = true, optional = true }
rivet-core.workspace = true
rivet-data.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
walkdir.workspace = true

[dev-dependencies]
arrow-ipc.workspace = true
bytes.workspace = true
futures.workspace = true
memmap2.workspace = true

[[example]]
name = "lance"
required-features = ["lance"]

[[example]]
name = "lance_cifar"
required-features = ["lance"]

[[example]]
name = "lancecopy"
required-features = ["lance"]

[[example]]
name = "lancedataset"
required-features = ["lance"]
