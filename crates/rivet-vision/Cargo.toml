[package]
name = "rivet-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Image semantics, transforms, and image dataset adapters for Rivet"

[features]
lance = ["dep:lance", "dep:tokio", "rivet-data/lance"]
blas = ["rivet-core/blas"]

[dependencies]
arrow.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
image = "0.25.10"
libm = "0.2.16"
rustfft = "6.4.1"
mozjpeg = { version = "0.10.13", default-features = false }
lance = { workspace = true, optional = true }
rivet-core.workspace = true
rivet-data.workspace = true
rivet-exec = { path = "../rivet-exec" }
rivet-plan.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true
tokio = { workspace = true, optional = true }
walkdir = "2.5.0"
webp = { version = "0.3.1", default-features = false }

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
futures = "0.3.34"
memmap2.workspace = true
num_cpus = "1.17"

[[bench]]
name = "phase3_fusions"
harness = false

[[bench]]
name = "transforms"
harness = false

[[example]]
name = "convert_hf_lance"
required-features = ["lance"]

[[example]]
name = "convert_imagefolder_lance"
required-features = ["lance"]

[[example]]
name = "lancedataset"
required-features = ["lance"]

[[example]]
name = "lancecopy"
required-features = ["lance"]

[[example]]
name = "lance"
required-features = ["lance"]

[[example]]
name = "lance_cifar"
required-features = ["lance"]

[[example]]
name = "lance_imagenet100"
required-features = ["lance"]
