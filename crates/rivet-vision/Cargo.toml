[package]
name = "rivet-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Image datasets, transforms, batching, caching, and data loading pipelines"

[features]
default = ["lance"]
lance = ["rivet-data/lance", "dep:lance"]

[dependencies]
arrow.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
image = "0.25.10"
lance = { workspace = true, optional = true }
rivet-core.workspace = true
rivet-data.workspace = true
thiserror.workspace = true
tokio.workspace = true
walkdir = "2.5.0"

[dev-dependencies]
arrow-ipc.workspace = true
bytes.workspace = true
futures = "0.3.34"
memmap2.workspace = true
num_cpus = "1.17"

[[example]]
name = "lance"
required-features = ["lance"]

[[example]]
name = "lance_cifar"
required-features = ["lance"]

[[example]]
name = "lancecopy"
required-features = ["lance"]

[[example]]
name = "lancedataset"
required-features = ["lance"]
